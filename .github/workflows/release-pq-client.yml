name: Release @buckitup/pq-client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version in package.json, e.g. 1.0.0'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag: next for a prerelease, latest for a release'
        required: true
        type: choice
        options: [next, latest]
        default: next
      publish:
        description: 'Publish to npm after the checks (false: dry run)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-pq-client
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Version and dist-tag agree
        run: |
          node -e '
            const pkg = require("./package.json");
            const { VERSION, DIST_TAG } = process.env;
            if (pkg.version !== VERSION) throw new Error(`package.json has ${pkg.version}, the input says ${VERSION}`);
            const pre = VERSION.includes("-");
            if (pre && DIST_TAG !== "next") throw new Error("a prerelease goes out under next");
            if (!pre && DIST_TAG !== "latest") throw new Error("a release goes out under latest");
          '
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$RUNNER_TEMP/pack/buckitup-pq-client-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Tarball holds only the package
        run: |
          unexpected=$(tar -tzf "${{ steps.pack.outputs.tarball }}" | grep -vE '^package/(dist/[A-Za-z.]+\.(js|d\.ts)|LICENSE|README\.md|CHANGELOG\.md|package\.json)$' || true)
          if [ -n "$unexpected" ]; then echo "unexpected files:"; echo "$unexpected"; exit 1; fi

      - name: Browser for the consumer check
        run: npx playwright install --with-deps chromium

      - name: Consumer check
        run: npm run check:consumer -- "${{ steps.pack.outputs.tarball }}" --browser

      - name: Publish dry run
        run: npm publish "${{ steps.pack.outputs.tarball }}" --dry-run --tag "$DIST_TAG" --access public

      - uses: actions/upload-artifact@v4
        with:
          name: pq-client-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        run: npm install -g npm@11

      - uses: actions/download-artifact@v4
        with:
          name: pq-client-tarball
          path: pack

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./pack/buckitup-pq-client-${VERSION}.tgz" --tag "$DIST_TAG" --access public --provenance
